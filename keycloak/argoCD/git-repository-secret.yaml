# Argo CD repository credentials for the Keycloak Applications' repoURL.
# Generated/updated by keycloak/configure-overlays.sh (GIT_* HEADER values).
# Required when the Git server uses a self-signed certificate or needs auth.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-git-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: keycloak-git-repo
  url: https://github.com/ebeaudoi/ocp-ansible-deployment.git
  # Set to "true" for self-signed Git TLS when the CA is not in argocd-tls-certs-cm.
  insecure: "true"
  # Optional — leave empty for anonymous/public repos; set for private Git.
  username: ""
  password: ""
