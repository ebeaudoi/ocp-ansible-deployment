apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crunchy-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: crunchy-operator
    server: https://kubernetes.default.svc
  project: appkeycloak
  source:
    path: keycloak/crunchy/operator/overlays/rdulab
    repoURL: https://github.com/ebeaudoi/ocp-ansible-deployment.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
