# From setup-keycloak-namespace.sh:
#   oc adm policy add-role-to-group view system:authenticated -n <NAMESPACE>
#   oc label rolebinding view purpose=Keycloak -n <NAMESPACE>
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view
  namespace: keycloak
  labels:
    purpose: Keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
