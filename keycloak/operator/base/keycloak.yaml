apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: sso
    purpose: Keycloak
spec:
  db:
    vendor: postgres
    url: jdbc:postgresql://keycloak-postgres-primary.keycloak.svc:5432/keycloak?currentSchema=public&sslmode=require
    usernameSecret:
      name: keycloak-postgres-pguser-keycloak
      key: user
    passwordSecret:
      name: keycloak-postgres-pguser-keycloak
      key: password
  hostname:
    hostname: keycloak.apps.ebdn-rd3.ebeaudoi.tamlab.rdu2.redhat.com
  http:
    tlsSecret: keycloak-tls-secret
  instances: 1
  ingress:
    enabled: true
