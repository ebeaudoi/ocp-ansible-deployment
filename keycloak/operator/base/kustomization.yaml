apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace + RBAC + RHBK operator only.
# Apply the Keycloak CR after the operator CRDs exist:
#   oc apply -k keycloak/instance/overlays/lab
resources:
  - namespace.yaml
  - rolebinding-view.yaml
  - rolebinding-anyuid.yaml
  - operator-group.yaml
  - rhbk-operator-subscription.yaml
