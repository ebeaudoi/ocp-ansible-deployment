apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace setup from setup-keycloak-namespace.sh, plus RHBK operator
# Subscription and Keycloak CR (from rhbk-operator-subscription.yaml / keycloak.yaml).
resources:
  - namespace.yaml
  - rolebinding-view.yaml
  - rolebinding-anyuid.yaml
  - operator-group.yaml
  - rhbk-operator-subscription.yaml
  - keycloak.yaml
