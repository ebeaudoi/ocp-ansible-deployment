# Equivalent of: oc adm policy add-scc-to-user anyuid -z default -n <ns>
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-anyuid
  namespace: keycloak
  labels:
    purpose: Keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keycloak
