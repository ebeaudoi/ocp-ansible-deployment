# From setup-keycloak-namespace.sh:
#   oc adm policy add-scc-to-user anyuid -z default -n <NAMESPACE>
# GitOps equivalent: bind the default SA to the anyuid SCC ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-anyuid
  namespace: keycloak
  labels:
    purpose: Keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keycloak
