apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Script arg 1: <namespace name>
namespace: keycloak

resources:
  - ../../base

patches:
  - target:
      version: v1
      kind: Namespace
      name: keycloak
    patch: |-
      - op: replace
        path: /metadata/name
        value: keycloak
  - path: subscription-patch.yaml
    target:
      group: operators.coreos.com
      version: v1alpha1
      kind: Subscription
      name: rhbk-operator
