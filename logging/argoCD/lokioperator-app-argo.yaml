apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lokioperator
  namespace: logging-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: logging/loki/base
    repoURL: https://github.com/ebeaudoi/ocp-ansible-deployment.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
