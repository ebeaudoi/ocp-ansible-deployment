# Argo CD repository credentials (HTTPS).
# Generated by configure-overlays.sh (GIT_* HEADER values).
# Applied by deploy-gitops.yaml Phase 1b after OpenShift GitOps is ready.
apiVersion: v1
kind: Secret
metadata:
  name: git-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: git-repo
  url: https://github.com/ebeaudoi/ocp-ansible-deployment.git
  insecure: "true"
  username: ""
  password: ""
