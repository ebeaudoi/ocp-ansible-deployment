# Convenience bundle for manual apply. Ansible applies these files individually.
# There is no umbrella cluster-apps Application — logging-apps and keycloak-apps
# are independent App-of-Apps roots.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-config-project.yaml
  - logging-apps.yaml
  - keycloak-apps.yaml
