# App-of-Apps root for the logging stack. Applied by deploy-gitops.yaml.
# Syncs logging/argoCD (AppProject applogging + child Applications).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-apps
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: cluster-config
  source:
    path: logging/argoCD
    repoURL: https://github.com/ebeaudoi/ocp-ansible-deployment.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
