---
- name: Manage Cluster Resources
  hosts: localhost
  gather_facts: false
  vars:
    # --- Cluster access ---
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/ocpkubeconfig"
    verify_ssl: false
    # ocp_token: "sha256~..."   # oc whoami --show-token
    # ansible_python_interpreter: "/usr/bin/python3"

    # --- Paths ---
    repo_root: "{{ playbook_dir }}"
    app_of_apps_dir: "{{ repo_root }}/gitops/app-of-apps"
    gitops_dir: "{{ repo_root }}/gitops"

    # --- OpenShift GitOps operator (OLM) ---
    gitops_operator_namespace: "openshift-gitops-operator"
    gitops_operatorgroup_name: "openshift-gitops-operator-group"
    gitops_subscription_name: "openshift-gitops-operator"
    gitops_subscription_package: "openshift-gitops-operator"
    gitops_channel: "gitops-1.21"
    gitops_catalog_source: "redhat-operators"
    gitops_catalog_namespace: "openshift-marketplace"
    gitops_install_plan_approval: "Manual"

    # --- Default Argo CD instance ---
    argocd_namespace: "openshift-gitops"
    argocd_name: "openshift-gitops"
    argocd_crd_name: "argocds.argoproj.io"

    # --- Sanity check ---
    sanity_check_namespace: "openshift-marketplace"

    # --- Wait / retry ---
    installplan_retries: 30
    installplan_delay: 10
    argocd_crd_retries: 30
    argocd_crd_delay: 10
    argocd_instance_retries: 40
    argocd_instance_delay: 10

    # --- Git repository access (shared by App-of-Apps roots) ---
    # Applied immediately after GitOps/Argo CD is ready (Phase 1b).
    git_repo_secret_manifest: "{{ gitops_dir }}/git-repository-secret.yaml"
    git_ca_file: "{{ gitops_dir }}/git-ca.crt"
    # When true and git_ca_file exists, merge into argocd-tls-certs-cm and restart repo-server.
    git_apply_ca: true
    # Hostname key in argocd-tls-certs-cm (empty => derived from Secret url:).
    git_tls_host: ""

    # --- App-of-Apps manifests (gitops/app-of-apps) ---
    # Two independent App-of-Apps roots (no single umbrella Application):
    #   logging_apps_manifest  → Application logging-apps
    #   keycloak_apps_manifest → Application keycloak-apps
    # Both use AppProject cluster-config. Each root syncs only its stack from Git.
    cluster_config_project_manifest: "{{ app_of_apps_dir }}/cluster-config-project.yaml"
    logging_apps_manifest: "{{ app_of_apps_dir }}/logging-apps.yaml"
    keycloak_apps_manifest: "{{ app_of_apps_dir }}/keycloak-apps.yaml"

    # Compatibility alias (older docs / -e gitopschannel=...)
    gitopschannel: "{{ gitops_channel }}"

  tasks:
    # =========================================================================
    # Phase 0 — Sanity check (cluster API reachable)
    # =========================================================================
    - name: Fetch list of pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        # api_key: "{{ ocp_token }}"
        verify_ssl: "{{ verify_ssl }}"
        kind: Pod
        namespace: "{{ sanity_check_namespace }}"
      register: pod_list

    # =========================================================================
    # Phase 1 — Install OpenShift GitOps operator + wait for Argo CD
    # =========================================================================
    - name: Ensure GitOps operator namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: v1
        kind: Namespace
        name: "{{ gitops_operator_namespace }}"
        state: present

    - name: Create GitOps OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ gitops_operatorgroup_name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            upgradeStrategy: Default

    - name: Create GitOps Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: "{{ gitops_subscription_name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            channel: "{{ gitops_channel }}"
            name: "{{ gitops_subscription_package }}"
            source: "{{ gitops_catalog_source }}"
            sourceNamespace: "{{ gitops_catalog_namespace }}"
            installPlanApproval: "{{ gitops_install_plan_approval }}"

    - name: Wait for GitOps InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ gitops_operator_namespace }}"
      register: gitops_install_plans
      failed_when: false
      until: (gitops_install_plans.resources | default([])) | length > 0
      retries: "{{ installplan_retries }}"
      delay: "{{ installplan_delay }}"

    - name: Approve GitOps InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            approved: true
      loop: "{{ gitops_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for ArgoCD CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ argocd_crd_name }}"
      register: argocd_crd
      failed_when: false
      until: (argocd_crd.resources | default([])) | length > 0
      retries: "{{ argocd_crd_retries }}"
      delay: "{{ argocd_crd_delay }}"

    - name: Wait for default ArgoCD instance in openshift-gitops namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: "{{ argocd_namespace }}"
        name: "{{ argocd_name }}"
      register: argocd_instance
      failed_when: false
      until: (argocd_instance.resources | default([])) | length > 0
      retries: "{{ argocd_instance_retries }}"
      delay: "{{ argocd_instance_delay }}"

    # =========================================================================
    # Phase 1b — Git repository access (right after GitOps is ready)
    #
    # Apply shared repo Secret and optional CA before any Application clones Git.
    # Manifests live under gitops/ (not under keycloak/).
    # Collect CA: ./gitops/collect-git-ca.sh <git-host-or-url>
    # =========================================================================

    - name: Deploy Git repository Secret (self-signed / private Git)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ git_repo_secret_manifest }}"
        state: present

    - name: Check for Git CA certificate file
      ansible.builtin.stat:
        path: "{{ git_ca_file }}"
      register: git_ca_stat

    # HTTPS only — SSH repos use sshPrivateKey / insecureIgnoreHostKey in the Secret.
    - name: Derive git_tls_host from repository Secret URL
      when:
        - git_apply_ca | bool
        - git_ca_stat.stat.exists
        - (git_tls_host | default('') | length) == 0
      vars:
        _git_url_hosts: >-
          {{
            lookup('file', git_repo_secret_manifest)
            | regex_findall('(?m)^\\s*url:\\s*https?://([^/\\s]+)')
          }}
      ansible.builtin.set_fact:
        git_tls_host: "{{ _git_url_hosts[0] if (_git_url_hosts | length) > 0 else '' }}"

    - name: Apply Git CA to Argo CD argocd-tls-certs-cm
      when:
        - git_apply_ca | bool
        - git_ca_stat.stat.exists
        - (git_tls_host | default('') | length) > 0
      ansible.builtin.shell: |
        set -euo pipefail
        oc --kubeconfig "{{ kubeconfig_path }}" -n "{{ argocd_namespace }}" \
          create configmap argocd-tls-certs-cm \
          --from-file="{{ git_tls_host }}={{ git_ca_file }}" \
          --dry-run=client -o yaml \
        | oc --kubeconfig "{{ kubeconfig_path }}" apply -f -
        oc --kubeconfig "{{ kubeconfig_path }}" -n "{{ argocd_namespace }}" \
          label configmap argocd-tls-certs-cm \
          app.kubernetes.io/name=argocd-tls-certs-cm \
          app.kubernetes.io/part-of=argocd \
          --overwrite
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restart Argo CD repo-server to pick up Git TLS CAs
      when:
        - git_apply_ca | bool
        - git_ca_stat.stat.exists
        - (git_tls_host | default('') | length) > 0
      ansible.builtin.command: >
        oc --kubeconfig {{ kubeconfig_path }}
        -n {{ argocd_namespace }}
        rollout restart deployment/openshift-gitops-repo-server
      changed_when: true

    # =========================================================================
    # Phase 2 — Two independent App-of-Apps deployments
    #
    # Instead of one umbrella Application (cluster-apps), this playbook registers
    # two root Applications in project cluster-config. They can sync, fail, or
    # be pruned independently:
    #
    #   1) logging-apps  (gitops/app-of-apps/logging-apps.yaml)
    #        source path: logging/argoCD
    #        creates: AppProject applogging + logging/Loki/COO/CLF Applications
    #        those children then sync workload manifests (operators, LokiStack, …)
    #
    #   2) keycloak-apps (gitops/app-of-apps/keycloak-apps.yaml)
    #        source path: keycloak/argoCD
    #        creates: AppProject appkeycloak + Crunchy/RHBK/Postgres/Keycloak Apps
    #        those children then sync workload manifests
    #
    # Ansible only applies: cluster-config → the two roots.
    # Git Secret/CA were applied in Phase 1b. Child Application YAMLs and workload
    # kustomizations are pulled from Git by Argo CD after the roots sync.
    # =========================================================================

    # Shared Argo CD AppProject that owns both App-of-Apps root Applications.
    - name: Deploy cluster-config AppProject
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ cluster_config_project_manifest }}"
        state: present

    # App-of-Apps #1 — logging stack root (syncs logging/argoCD from Git).
    - name: Deploy logging-apps (App-of-Apps for logging)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ logging_apps_manifest }}"
        state: present

    # App-of-Apps #2 — Keycloak stack root (syncs keycloak/argoCD from Git).
    - name: Deploy keycloak-apps (App-of-Apps for Keycloak)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ keycloak_apps_manifest }}"
        state: present
