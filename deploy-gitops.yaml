---
- name: Manage Cluster Resources
  hosts: localhost
  gather_facts: false
  vars:
    # --- Cluster access ---
    kubeconfig_path: "ocpkubeconfig"
    verify_ssl: false
    # ocp_token: "sha256~..."   # oc whoami --show-token
    # ansible_python_interpreter: "/usr/bin/python3"

    # --- Paths ---
    repo_root: "{{ playbook_dir }}"
    logging_argocd_dir: "{{ repo_root }}/logging/argoCD"
    keycloak_argocd_dir: "{{ repo_root }}/keycloak/argoCD"

    # --- OpenShift GitOps operator (OLM) ---
    gitops_operator_namespace: "openshift-gitops-operator"
    gitops_operatorgroup_name: "openshift-gitops-operator-group"
    gitops_subscription_name: "openshift-gitops-operator"
    gitops_subscription_package: "openshift-gitops-operator"
    gitops_channel: "gitops-1.21"
    gitops_catalog_source: "redhat-operators"
    gitops_catalog_namespace: "openshift-marketplace"
    gitops_install_plan_approval: "Manual"

    # --- Default Argo CD instance ---
    argocd_namespace: "openshift-gitops"
    argocd_name: "openshift-gitops"
    argocd_crd_name: "argocds.argoproj.io"

    # --- Sanity check ---
    sanity_check_namespace: "openshift-marketplace"

    # --- Wait / retry ---
    installplan_retries: 30
    installplan_delay: 10
    argocd_crd_retries: 30
    argocd_crd_delay: 10
    argocd_instance_retries: 40
    argocd_instance_delay: 10

    # --- Logging Argo CD manifests ---
    logging_appproject_manifest: "{{ logging_argocd_dir }}/applogging-project.yaml"
    logging_operator_app_manifest: "{{ logging_argocd_dir }}/loggingoperator-app-argo.yaml"
    loki_operator_app_manifest: "{{ logging_argocd_dir }}/lokioperator-app-argo.yaml"
    loki_instance_app_manifest: "{{ logging_argocd_dir }}/loki-instance-app-argo.yaml"
    coo_app_manifest: "{{ logging_argocd_dir }}/coo-app-argo.yaml"
    logging_instance_app_manifest: "{{ logging_argocd_dir }}/logginginstance-app-argo.yaml"

    # --- Keycloak Argo CD manifests ---
    keycloak_git_repo_secret_manifest: "{{ keycloak_argocd_dir }}/git-repository-secret.yaml"
    keycloak_appproject_manifest: "{{ keycloak_argocd_dir }}/appkeycloak-project.yaml"
    crunchy_operator_app_manifest: "{{ keycloak_argocd_dir }}/crunchy-operator-app-argo.yaml"
    rhbk_operator_app_manifest: "{{ keycloak_argocd_dir }}/rhbk-operator-app-argo.yaml"
    crunchy_instance_app_manifest: "{{ keycloak_argocd_dir }}/crunchy-instance-app-argo.yaml"
    keycloak_instance_app_manifest: "{{ keycloak_argocd_dir }}/keycloak-instance-app-argo.yaml"

    # Compatibility alias (older docs / -e gitopschannel=...)
    gitopschannel: "{{ gitops_channel }}"

  tasks:
    # Sanity-check cluster API access via the marketplace namespace
    - name: Fetch list of pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        # api_key: "{{ ocp_token }}"
        verify_ssl: "{{ verify_ssl }}"
        kind: Pod
        namespace: "{{ sanity_check_namespace }}"
      register: pod_list

    # --- OpenShift GitOps Operator ---

    - name: Ensure GitOps operator namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: v1
        kind: Namespace
        name: "{{ gitops_operator_namespace }}"
        state: present

    - name: Create GitOps OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ gitops_operatorgroup_name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            upgradeStrategy: Default

    - name: Create GitOps Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: "{{ gitops_subscription_name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            channel: "{{ gitops_channel }}"
            name: "{{ gitops_subscription_package }}"
            source: "{{ gitops_catalog_source }}"
            sourceNamespace: "{{ gitops_catalog_namespace }}"
            installPlanApproval: "{{ gitops_install_plan_approval }}"

    - name: Wait for GitOps InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ gitops_operator_namespace }}"
      register: gitops_install_plans
      failed_when: false
      until: (gitops_install_plans.resources | default([])) | length > 0
      retries: "{{ installplan_retries }}"
      delay: "{{ installplan_delay }}"

    - name: Approve GitOps InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: "{{ gitops_operator_namespace }}"
          spec:
            approved: true
      loop: "{{ gitops_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    - name: Wait for ArgoCD CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ argocd_crd_name }}"
      register: argocd_crd
      failed_when: false
      until: (argocd_crd.resources | default([])) | length > 0
      retries: "{{ argocd_crd_retries }}"
      delay: "{{ argocd_crd_delay }}"

    - name: Wait for default ArgoCD instance in openshift-gitops namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: "{{ argocd_namespace }}"
        name: "{{ argocd_name }}"
      register: argocd_instance
      failed_when: false
      until: (argocd_instance.resources | default([])) | length > 0
      retries: "{{ argocd_instance_retries }}"
      delay: "{{ argocd_instance_delay }}"

    # --- Logging Argo CD project + Applications ---

    - name: Deploy applogging AppProject
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ logging_appproject_manifest }}"
        state: present

    - name: Deploy logging operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ logging_operator_app_manifest }}"
        state: present

    - name: Deploy loki operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ loki_operator_app_manifest }}"
        state: present

    - name: Deploy loki instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ loki_instance_app_manifest }}"
        state: present

    - name: Deploy coo
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ coo_app_manifest }}"
        state: present

    - name: Deploy logging instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ logging_instance_app_manifest }}"
        state: present

    # --- Keycloak Argo CD project + Applications ---
    # git-repository-secret must exist first so Argo CD can fetch a self-signed / private Git URL.

    - name: Deploy Keycloak Git repository Secret (self-signed / private Git)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ keycloak_git_repo_secret_manifest }}"
        state: present

    - name: Deploy appkeycloak AppProject
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ keycloak_appproject_manifest }}"
        state: present

    - name: Deploy crunchy operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ crunchy_operator_app_manifest }}"
        state: present

    - name: Deploy rhbk operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ rhbk_operator_app_manifest }}"
        state: present

    - name: Deploy keycloak postgres instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ crunchy_instance_app_manifest }}"
        state: present

    - name: Deploy keycloak instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        verify_ssl: "{{ verify_ssl }}"
        src: "{{ keycloak_instance_app_manifest }}"
        state: present
