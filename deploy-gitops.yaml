---
- name: Manage Cluster Resources
  hosts: localhost                # Always run on the control node/localhost
  gather_facts: false
  vars:
    kubeconfig_path: "ocpkubeconfig"
    repo_root: "{{ playbook_dir }}"
    gitopschannel: "gitops-1.21"
#    ocp_token: "sha256~xczxoFdZi4SOi4lD_HEKnviAE2IGaiY5MAi4XixJlqs"  #oc whoami --show-token
#    ansible_python_interpreter: "/usr/bin/python3"


  tasks:
    # Sanity-check cluster API access via the marketplace namespace
    - name: Fetch list of pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
#        api_key: "{{ ocp_token }}"
        verify_ssl: false
        kind: Pod
        namespace: openshift-marketplace
      register: pod_list

    # --- OpenShift GitOps Operator ---

    # Create the namespace that hosts the GitOps operator
    - name: Ensure GitOps operator namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: openshift-gitops-operator
        state: present

    # Scope the GitOps operator install to its operator namespace
    - name: Create GitOps OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-gitops-operator-group
            namespace: openshift-gitops-operator
          spec:
            upgradeStrategy: Default

    # Subscribe to the GitOps operator (manual InstallPlan approval)
    - name: Create GitOps Subscription (Manual Approval)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-gitops-operator
          spec:
            channel: "{{ gitopschannel }}"
            name: openshift-gitops-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Manual

    # Poll until OLM creates an InstallPlan for the Subscription
    - name: Wait for GitOps InstallPlan to be generated
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: openshift-gitops-operator
      register: gitops_install_plans
      failed_when: false
      until: (gitops_install_plans.resources | default([])) | length > 0
      retries: 30
      delay: 10

    # Approve pending InstallPlans so the operator can install
    - name: Approve GitOps InstallPlan
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: openshift-gitops-operator
          spec:
            approved: true
      loop: "{{ gitops_install_plans.resources | default([]) }}"
      when: not (item.spec.approved | default(false))

    # Wait until the ArgoCD CRD is available cluster-wide
    - name: Wait for ArgoCD CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: argocds.argoproj.io
      register: argocd_crd
      failed_when: false
      until: (argocd_crd.resources | default([])) | length > 0
      retries: 30
      delay: 10

    # Wait for the default openshift-gitops Argo CD instance
    - name: Wait for default ArgoCD instance in openshift-gitops namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
        name: openshift-gitops
      register: argocd_instance
      failed_when: false
      until: (argocd_instance.resources | default([])) | length > 0
      retries: 40
      delay: 10

    # --- Logging Argo CD project + Applications ---

    # Create AppProject applogging for all logging Applications
    - name: Deploy applogging AppProject
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/applogging-project.yaml"
        state: present

    # Register the Logging operator Application under project applogging
    - name: Deploy logging operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/loggingoperator-app-argo.yaml"
        state: present

    # Register the Loki operator Application under project applogging
    - name: Deploy loki operator
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/lokioperator-app-argo.yaml"
        state: present

    # Register the LokiStack instance Application under project applogging
    - name: Deploy loki instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/loki-instance-app-argo.yaml"
        state: present

    # Register the Cluster Observability Operator Application under project applogging
    - name: Deploy coo
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/coo-app-argo.yaml"
        state: present

    # Register the ClusterLogForwarder / logging instance Application under project applogging
    - name: Deploy logging instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ repo_root }}/logging/argoCD/logginginstance-app-argo.yaml"
        state: present
